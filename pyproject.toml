[tool.poetry]
name = "target-shopify-v2"
version = "0.0.5"
description = "`target-shopify-v2` is a Singer target for TargetShopifyV2, built with the Meltano SDK for Singer Targets."
authors = ["Adil Ahmed"]
keywords = [
    "ELT",
    "TargetShopifyV2",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.7.1"
requests = "^2.25.1"
boto3 = "^1.20"
singer-sdk = "0.9.0"
target-hotglue = {git = "https://gitlab.com/hotglue/target-hotglue-sdk.git", rev = "main"}

[tool.poetry.dev-dependencies]
hotglue-smoke-test = "^1.1.3"
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^21.9b0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_shopify_v2"

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-shopify-v2 = 'target_shopify_v2.target:TargetTargetShopifyV2.cli'
